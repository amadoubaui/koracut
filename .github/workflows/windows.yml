# KoraCut sous Windows : compilation par MSYS2 (UCRT64, les mêmes versions de Qt 6, KF6 et MLT que le paquet
# Kdenlive de MSYS2), tests, puis captures d'écran de l'application ouverte, pour comparer avec le Mac
# (chantier 12, 30 septembre 2026). Craft (MSVC) reste la voie de l'installeur final.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [koracut]
    paths-ignore: ['**.md', 'po/**']

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            cc:p cmake:p ninja:p extra-cmake-modules:p icoutils:p qt6-tools:p
            breeze-icons:p breeze:p frei0r-plugins:p karchive:p kbookmarks:p kcodecs:p kcolorscheme:p kcompletion:p
            kconfig:p kconfigwidgets:p kcoreaddons:p kcrash:p kddockwidgets:p kfilemetadata:p kguiaddons:p ki18n:p
            kiconthemes:p kio:p kitemviews:p knewstuff:p knotifications:p knotifyconfig:p ktextwidgets:p
            kwidgetsaddons:p kxmlgui:p mlt:p opentimelineio:p purpose:p shared-mime-info:p qqc2-desktop-style:p
            qt6-base:p qt6-declarative:p qt6-multimedia:p qt6-networkauth:p qt6-svg:p qt6-websockets:p
            qtkeychain-qt6:p solid:p ffmpeg:p imath:p python:p ccache:p gdb:p
            fftw:p libebur128:p libsamplerate:p libvorbis:p rtaudio:p rnnoise:p rubberband:p sox:p vid.stab:p
            qt6-5compat:p gdk-pixbuf2:p pango:p

      # ccache : la première compilation prend 2 heures, les suivantes ne refont que ce qui a changé.
      - name: Cache de compilation
        uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configurer
        run: |
          export CCACHE_DIR="$PWD/ccache" CCACHE_MAXSIZE=3G
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" \
            -DBUILD_TESTING=ON -DKORACUT_AGENTS=ON -DUSE_DBUS=OFF -DRELEASE_BUILD=ON 2>&1 | tail -40

      - name: Compiler
        run: |
          export CCACHE_DIR="$PWD/ccache" CCACHE_MAXSIZE=3G
          cmake --build build -j 4 > build.log 2>&1; code=$?
          ccache -s | head -8
          grep -E "error|FAILED" build.log | head -200
          exit $code

      - name: Installer
        run: cmake --install build > install.log 2>&1 || tail -40 install.log

      - name: Tests
        continue-on-error: true
        run: |
          # Les tests initialisent MLT à côté de leur dossier (build/lib/mlt, build/share/mlt) : on y pose l'installation.
          mkdir -p build/lib build/share
          cp -r "$MINGW_PREFIX/lib/mlt" build/lib/ && cp -r "$MINGW_PREFIX/share/mlt" build/share/
          # Sous Windows, KDE installe les données dans bin/data, à côté de l'exécutable (effets, thèmes, scripts).
          cp -r "$MINGW_PREFIX/bin/data" build/bin/
          cd build
          # Les tests tournent depuis build/bin : sous Windows, MLT chercherait ses modules à côté (build/lib/mlt).
          export MLT_REPOSITORY="$(cygpath -w "$MINGW_PREFIX/lib/mlt")" MLT_DATA="$(cygpath -w "$MINGW_PREFIX/share/mlt")"
          export MLT_PROFILES_PATH="$(cygpath -w "$MINGW_PREFIX/share/mlt/profiles")" MLT_PRESETS_PATH="$(cygpath -w "$MINGW_PREFIX/share/mlt/presets")"
          QT_QPA_PLATFORM=offscreen ctest -j 2 --timeout 600 --output-on-failure > ../tests-windows.log 2>&1
          grep -E "tests passed|\(Failed\)|\(SEGFAULT\)|\(Timeout\)|Exception" ../tests-windows.log | tail -40

      - name: Piles d'appels des tests qui plantent
        continue-on-error: true
        run: |
          cd build
          export MLT_REPOSITORY="$(cygpath -w "$MINGW_PREFIX/lib/mlt")" MLT_DATA="$(cygpath -w "$MINGW_PREFIX/share/mlt")" QT_QPA_PLATFORM=offscreen
          for t in $(grep -E "\((SEGFAULT|Subprocess aborted)\)" ../tests-windows.log | awk '{print $3}' | sort -u | head -5); do
            echo "=== $t" >> ../piles-windows.log
            timeout 600 gdb -q -batch -ex run -ex bt "bin/$t.exe" 2>&1 | grep -E "^#|received signal|SIG" | head -40 >> ../piles-windows.log
          done
          cat ../piles-windows.log || true

      - name: Captures d'écran de KoraCut ouverte
        continue-on-error: true
        run: |
          mkdir -p captures
          # Un écran de 1920 x 1080 en mode sombre, pour comparer avec les captures du Mac et de Linux.
          powershell -Command "Set-DisplayResolution -Width 1920 -Height 1080 -Force" || true
          reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v AppsUseLightTheme //t REG_DWORD //d 0 //f || true
          printf '[startup]\nshowWelcome=false\n' > "$LOCALAPPDATA/koracut-capturesrc"
          export KORACUT_SHOT="$(cygpath -w "$PWD/captures/windows.png")" KORACUT_SHOT_SIZE=1440x900 KORACUT_SHOT_DELAY=15000
          export KORACUT_SHOT_MODULES=montage,etalonnage,audio,export
          timeout 300 koracut.exe --config koracut-capturesrc --no-welcome > captures/koracut.log 2>&1 || echo "code $?"
          ls -la captures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koracut-windows
          path: |
            captures
            tests-windows.log
            install.log
            build.log
            piles-windows.log
          if-no-files-found: warn
